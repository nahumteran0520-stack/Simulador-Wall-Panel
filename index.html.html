<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Wall Panel y Diseños</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Contenedor principal de la escena 3D / Render */
        #simulator-viewport {
            flex: 1;
            position: relative;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Paredes y elementos de la sala */
        .room-scene {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #ffffff; /* Pared blanca base */
        }
        /* Panel central (ej. Mármol o WPC) */
        .central-panel {
            width: 50%;
            height: 80%;
            background-image: url('path-to-marble-texture.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        /* Televisor */
        .tv-screen {
            width: 45%;
            height: 40%;
            background-color: #000000;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 4px solid #222;
        }
        /* Mueble flotante */
        .floating-cabinet {
            position: absolute;
            bottom: 20%;
            width: 55%;
            height: 8%;
            background-color: #d2b48c; /* Tono madera base */
            background-size: cover;
            border-radius: 4px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.15);
        }
        /* Panel de Control Inferior */
        #control-panel {
            height: 120px;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #333;
        }
        .control-btn {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .control-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div id="simulator-viewport">
        <div class="room-scene" id="roomScene">
            <div class="central-panel" id="centralPanel">
                <div class="tv-screen"></div>
            </div>
            <div class="floating-cabinet" id="floatingCabinet"></div>
        </div>
    </div>

    <div id="control-panel">
        <button class="control-btn" onclick="changeTexture('marble')">Mármol Blanco</button>
        <button class="control-btn" onclick="changeTexture('wpc')">Panel WPC Madera</button>
        <button class="control-btn" onclick="changeTexture('plain')">Pared Lisa Blanca</button>
    </div>

    <script>
        function changeTexture(type) {
            const panel = document.getElementById('centralPanel');
            if (type === 'marble') {
                panel.style.backgroundColor = '#ffffff';
                panel.style.backgroundImage = "url('marble-texture.jpg')";
            } else if (type === 'wpc') {
                panel.style.backgroundColor = '#8b5a2b';
                panel.style.backgroundImage = "url('wpc-slats.jpg')";
            } else if (type === 'plain') {
                panel.style.backgroundImage = 'none';
                panel.style.backgroundColor = '#ffffff';
            }
        }
    </script>
</body>
</html>
