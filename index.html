<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interactivo Wall Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <aside id="catalog-sidebar">
        <div class="catalog-section">
            <h2>Catálogo de Acabados</h2>
            
            <div class="catalog-category">
                <label>Panel Central (Mármol)</label>
                <div class="catalog-options">
                    <button class="catalog-btn tex-btn active" onclick="changeTexture('blanco', this)">Blanco</button>
                    <button class="catalog-btn tex-btn" onclick="changeTexture('gris', this)">Gris</button>
                    <button class="catalog-btn tex-btn" onclick="changeTexture('negro', this)">Negro</button>
                    <button class="catalog-btn tex-btn" onclick="changeTexture('none', this)">Liso</button>
                </div>
            </div>

            <div class="catalog-category">
                <label>Orientación del Centro</label>
                <div class="catalog-options">
                    <button class="catalog-btn orient-btn active" onclick="setOrientation('vertical', this)">Vertical</button>
                    <button class="catalog-btn orient-btn" onclick="setOrientation('horizontal', this)">Horizontal</button>
                </div>
            </div>

            <div class="catalog-category">
                <label>Pared (Wall Panels WPC)</label>
                <div class="catalog-options">
                    <button class="catalog-btn wpc-btn active" onclick="changeBackgroundWall('wpcarena', this)">Arena</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('wpcgris', this)">Gris</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('wpcnegro', this)">Negro</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('wpcwengue', this)">Wengué</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('wpcblanco', this)">Blanco</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('wpcmaderanegro', this)">Madera Negro</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('wpcmarron', this)">Marron</button>
                    <button class="catalog-btn wpc-btn" onclick="changeBackgroundWall('none', this)">Pared Lisa (Pintura)</button>
                </div>
            </div>

            <div class="catalog-category">
                <label>Luces Panel Central</label>
                <div class="catalog-options">
                    <button class="catalog-btn panel-led-btn active" onclick="togglePanelLed('none', this)">Apagadas</button>
                    <button class="catalog-btn panel-led-btn" onclick="togglePanelLed('warm', this)">Cálida</button>
                    <button class="catalog-btn panel-led-btn" onclick="togglePanelLed('cool', this)">Fría</button>
                </div>
            </div>

            <div class="catalog-category">
                <label>Luces Laterales (WPC)</label>
                <div class="catalog-options">
                    <button class="catalog-btn side-led-btn active" onclick="toggleSideLed('none', this)">Apagadas</button>
                    <button class="catalog-btn side-led-btn" onclick="toggleSideLed('warm', this)">Cálida</button>
                    <button class="catalog-btn side-led-btn" onclick="toggleSideLed('cool', this)">Fría</button>
                </div>
            </div>

        </div>
    </aside>

    <div id="simulator-viewport">
        <div class="room-scene" id="roomScene">
            
            <!-- Pared de Fondo WPC -->
            <div class="full-background-wall" id="fullBackgroundWall"></div>
            
            <!-- Líneas de Luz LED Verticales en los Costados con sus IDs -->
            <div class="wall-led-light left-long" id="leftLong"></div>
            <div class="wall-led-light left-short" id="leftShort"></div>
            <div class="wall-led-light right-long" id="rightLong"></div>
            <div class="wall-led-light right-short" id="rightShort"></div>

            <!-- Panel Central de Mármol -->
            <div class="central-panel vertical" id="centralPanel"></div>

            <!-- Capa Frontal con TV y Mueble -->
            <div class="foreground-overlay"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
