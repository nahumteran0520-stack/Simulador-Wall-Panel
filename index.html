<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Wall Panel - Centro y Costados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Escena del Simulador -->
    <div id="simulator-viewport">
        <div class="room-scene" id="roomScene">
            <!-- Paneles laterales (Para los WPC que estás descargando) -->
            <div class="side-panel-left" id="sideLeft"></div>
            
            <!-- Panel Central con el Mármol y la TV -->
            <div class="central-panel vertical" id="centralPanel">
                <div class="tv-screen"></div>
            </div>

            <!-- Panel lateral derecho -->
            <div class="side-panel-right" id="sideRight"></div>

            <!-- Mueble flotante -->
            <div class="floating-cabinet" id="floatingCabinet"></div>
        </div>
    </div>

    <!-- Panel de Control Inferior -->
    <div id="control-panel">
        <!-- Controles para el Mármol Central -->
        <div class="control-group">
            <span>Diseño Centro (Mármol)</span>
            <div class="button-row">
                <button class="control-btn tex-btn" onclick="changeTexture('blanco')">Blanco</button>
                <button class="control-btn tex-btn" onclick="changeTexture('gris')">Gris</button>
                <button class="control-btn tex-btn" onclick="changeTexture('negro')">Negro</button>
                <button class="control-btn tex-btn" onclick="changeTexture('none')">Ninguno</button>
            </div>
        </div>

        <!-- Controles de Orientación -->
        <div class="control-group">
            <span>Orientación Panel</span>
            <div class="button-row">
                <button class="control-btn orient-btn active" onclick="setOrientation('vertical')">Vertical</button>
                <button class="control-btn orient-btn" onclick="setOrientation('horizontal')">Horizontal</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
